# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: Celestium 1.21.1 validation

on:
  push:
    branches: [mc-1.21.1]
  pull_request:
    branches: [mc-1.21.1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: clean compile and feature tests
        run: ./gradlew --no-daemon clean test
      - name: deterministic data generation
        shell: bash
        run: |
          ./gradlew --no-daemon runDatagen
          first_hash="$(find src/main/generated -type f ! -path '*/.cache/*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          ./gradlew --no-daemon runDatagen
          second_hash="$(find src/main/generated -type f ! -path '*/.cache/*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          test "$first_hash" = "$second_hash"
          test "$(find src/main/generated -type f ! -path '*/.cache/*' | wc -l)" -eq 77
          git diff --exit-code -- src/main/generated ':(exclude)src/main/generated/.cache/**'
      - name: namespace, source-set, and resource audits
        shell: bash
        run: |
          ! grep -RIE 'shopsandtools|shops-and-tools' src/main src/client build.gradle gradle.properties settings.gradle
          ! grep -RE 'net\.minecraft\.client|net\.fabricmc\.fabric\.api\.client' src/main/java
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = (
              list(Path('src/main/generated').rglob('*.json'))
              + list(Path('src/main/resources').rglob('*.json'))
              + list(Path('src/client/resources').rglob('*.json'))
          )
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          assert len(files) == 89, len(files)
          PY
      - name: build release and source jars
        run: ./gradlew --no-daemon build verifyProductionMixinRefmaps
      - name: verify release names and production mixin packaging
        shell: bash
        run: |
          test -f build/libs/celestium-1.21.1-1.0.1.jar
          test -f build/libs/celestium-1.21.1-1.0.1-sources.jar
          unzip -l build/libs/celestium-1.21.1-1.0.1.jar > jar-entries.txt
          ! grep -Ei 'shopsandtools|shops-and-tools|ArmorFeatureRendererMixin' jar-entries.txt
          grep -q 'celestium.mixins.json' jar-entries.txt
          grep -q 'celestium.client.mixins.json' jar-entries.txt
          grep -q 'celestium-1.21.1-refmap.json' jar-entries.txt
          grep -q 'client-celestium-1.21.1-refmap.json' jar-entries.txt
          grep -q 'ElytraFeatureRendererMixin' jar-entries.txt
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
