}

tasks.register("identityAudit") {
	group = "verification"
	description = "Verifies the canonical identity and the strictly limited legacy compatibility surface."

	doLast {
		String legacyIdentity = ["shops", "andtools"].join()
		String prohibitedProductName = ["co", "dex"].join()
		List<String> legacyAllowlist = [
			"src/main/java/net/inklinggamer/celestium/migration/",
			"src/main/resources/assets/${legacyIdentity}/",
			"src/main/resources/data/${legacyIdentity}/",
			"src/test/java/net/inklinggamer/celestium/migration/",
			"src/main/resources/fabric.mod.json",
			"MIGRATION.md"
		]
		List<String> violations = []

		fileTree(rootDir) {
			exclude ".git/**", ".gradle/**", ".gradle-user-home/**", ".idea/**", "build/**", "run/**", "logs/**"
		}.files.findAll { it.isFile() }.each { candidate ->
			byte[] bytes = candidate.bytes
			if (bytes.any { it == 0 }) {
				return
			}
			String relative = rootDir.toPath().relativize(candidate.toPath()).toString().replace('\\', '/')
			String text = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
			String lower = text.toLowerCase(java.util.Locale.ROOT)
			if (lower.contains(prohibitedProductName)) {
				violations.add("${relative}: prohibited product reference")
			}
			if (lower.contains(legacyIdentity) && !legacyAllowlist.any { relative.startsWith(it) || relative == it }) {
				violations.add("${relative}: legacy identity outside compatibility allowlist")
			}
		}

		if (!violations.isEmpty()) {
			throw new GradleException("Identity audit failed:\n" + violations.join("\n"))
		}
	}
}

tasks.named("sourcesJar") {
	dependsOn(tasks.named("runDatagen"))
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
