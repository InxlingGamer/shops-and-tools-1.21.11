tasks.register("verifyProductionMixinRefmaps", JavaExec) {
	group = "verification"
	description = "Audits both mixin configurations and refmaps inside the remapped production JAR."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "net.inklinggamer.celestium.client.CelestiumProductionMixinRefmapTest"
	dependsOn(tasks.named("remapJar"), tasks.named("testClasses"))
	doFirst {
		args tasks.named("remapJar").get().archiveFile.get().asFile.absolutePath
	}
}

sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

tasks.named("test") {
	dependsOn(tasks.named("runXpBonusTests"))
	dependsOn(tasks.named("runCelestiumHoeTests"))
	dependsOn(tasks.named("runCelestiumPickaxeTests"))
	dependsOn(tasks.named("runCelestiumShovelTests"))
	dependsOn(tasks.named("runCelestiumLeggingsTests"))
	dependsOn(tasks.named("runCelestiumHorseArmorTests"))
	dependsOn(tasks.named("runCelestiumBootsTests"))
	dependsOn(tasks.named("runCelestiumBlockTests"))
	dependsOn(tasks.named("runCelestiumBlockItemAssetTests"))
	dependsOn(tasks.named("runCelestiumIrisCompatTests"))
	dependsOn(tasks.named("runCelestiumElytraRenderingTests"))
	dependsOn(tasks.named("runCelestiumMetadataTests"))
	dependsOn(tasks.named("runCelestiumItemTests"))
	dependsOn(tasks.named("runCelestiumTrimTagTests"))
	dependsOn(tasks.named("runCelestiumSmithingResultTests"))
	dependsOn(tasks.named("runCelestiumAdvancementTests"))
	dependsOn(tasks.named("runWardenFeatureTests"))
	dependsOn(tasks.named("runCelestiumWorldVersionGuardTests"))
}

tasks.named("sourcesJar") {
	dependsOn(tasks.named("runDatagen"))
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
